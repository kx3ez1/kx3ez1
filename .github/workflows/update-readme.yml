name: Update README with Repos

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install requests

    - name: Generate Repo List
      env:
        GH_USERNAME: ${{ github.repository_owner }}
      run: |
        python -c "
        import requests
        import os

        username = os.getenv('GH_USERNAME')
        response = requests.get(f'https://api.github.com/users/{username}/repos?per_page=100')
        repos = response.json()

        if isinstance(repos, dict) and 'message' in repos:
            print('API Error:', repos['message'])
            exit(1)

        repos = sorted([r for r in repos if not r.get('fork', False)], key=lambda x: x.get('stargazers_count', 0), reverse=True)

        readme_content = f'# Hi there! 👋\n\n## 📊 My Public Repositories\n\n'
        for repo in repos:
            name = repo.get('name', 'Unnamed')
            url = repo.get('html_url', '#')
            stars = repo.get('stargazers_count', 0)
            desc = repo.get('description') if repo.get('description') else 'No description provided.'
            readme_content += f'- **[{name}]({url})** - ⭐ {stars} | {desc}\n'

        with open('README.md', 'w', encoding='utf-8') as f:
            f.write(readme_content)
        "

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add README.md
        git diff-index --quiet HEAD || git commit -m "Automated README update with latest repos"
        git push
